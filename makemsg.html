<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages Data | Nike Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #000;
            color: #fff;
            padding: 40px;
        }

        header {
            margin-bottom: 40px;
            font-size: 20px;
            letter-spacing: 3px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
        }

        .logo {
            font-weight: bold;
            font-size: 24px;
        }

        a {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid #fff;
            padding: 8px 15px;
            transition: 0.3s;
        }

        a:hover {
            background: #fff;
            color: #000;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .messages-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .message-card {
            background: #111;
            border: 1px solid #333;
            padding: 20px;
            border-radius: 4px;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #222;
        }

        .message-name {
            font-size: 18px;
            font-weight: bold;
        }

        .message-email {
            color: #aaa;
            font-size: 14px;
        }

        .message-date {
            color: #555;
            font-size: 12px;
        }

        .message-body {
            font-size: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .no-messages {
            text-align: center;
            padding: 50px;
            color: #777;
            font-style: italic;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <div class="logo">NIKE ADMIN</div>
            <a href="/">← BACK TO SITE</a>
        </header>

        <h2 style="margin-bottom: 20px; font-weight: 300; letter-spacing: 2px;">CONTACT ENQUIRIES</h2>

        <div id="messagesContainer" class="messages-grid">
            <div class="no-messages">Loading messages...</div>
        </div>
    </div>

    <script>
        async function fetchMessages() {
            const container = document.getElementById('messagesContainer');
            try {
                // Fetch the JSON file generated by server.js
                // Express static serves it from the root
                const res = await fetch('http://localhost:3000/makemsg.json');

                if (!res.ok) {
                    if (res.status === 404) {
                        container.innerHTML = '<div class="no-messages">No messages yet. (File not created)</div>';
                        return;
                    }
                    throw new Error('Failed to fetch messages');
                }

                const text = await res.text();
                let data = [];
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    console.error("Invalid response format:", text);
                }

                if (!Array.isArray(data) || data.length === 0) {
                    container.innerHTML = '<div class="no-messages">No messages found.</div>';
                    return;
                }

                container.innerHTML = '';

                // Sort by newest first
                data.sort((a, b) => new Date(b.date) - new Date(a.date));

                data.forEach(msg => {
                    const dateObj = new Date(msg.date);
                    const formattedDate = dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString();

                    const card = document.createElement('div');
                    card.className = 'message-card';
                    card.innerHTML = `
                        <div class="message-header">
                            <div>
                                <div class="message-name">${msg.name}</div>
                                <div class="message-email"><a href="mailto:${msg.email}" style="padding:0; border:none; border-bottom:1px solid #aaa; color:#aaa;">${msg.email}</a></div>
                            </div>
                            <div class="message-date">${formattedDate}</div>
                        </div>
                        <div class="message-body">${msg.message}</div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="no-messages" style="color: #F44336;">Error loading messages: ' + error.message + '</div>';
            }
        }

        fetchMessages();
    </script>
</body>

</html>
